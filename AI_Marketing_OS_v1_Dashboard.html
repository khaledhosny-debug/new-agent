<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Marketing OS v1</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
--bg:#050505;--card:#111111;--border:#242424;--text:#fff;
--muted:#a1a1aa;--snap:#FFFC00;--meta:#1877F2;--tiktok:#25F4EE;--google:#34A853;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Tahoma}
.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:#0b0b0b;border-left:1px solid var(--border);padding:20px}
.logo{font-size:22px;font-weight:700;margin-bottom:30px}
.menu div{padding:12px;border-radius:10px;margin-bottom:8px;background:#121212}
.main{padding:24px}
.top{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px}
textarea{width:100%;height:220px;background:#0a0a0a;color:white;border:1px solid #333;border-radius:12px;padding:12px}
button{background:white;color:black;border:none;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:20px 0}
.kpi{background:var(--card);border:1px solid var(--border);padding:15px;border-radius:16px}
.value{font-size:28px;font-weight:800}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.platforms{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px}
.platform{padding:15px;border-radius:16px;color:black;font-weight:700}
.snap{background:var(--snap)}
.meta{background:var(--meta);color:white}
.google{background:var(--google)}
.tiktok{background:var(--tiktok)}
.small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar">
<div class="logo">AI Marketing OS</div>
<div class="menu">
<div>📊 Dashboard</div>
<div>🔍 Deep Audit</div>
<div>📈 Media Plan</div>
<div>🤖 AI Copilot</div>
</div>
</div>

<div class="main">
<h1>Executive Dashboard</h1>

<div class="top">
<div class="card">
<h3>ادخل البيانات كنص عادي</h3>
<textarea id="input">Platform: Snapchat
Spend: 15000
Revenue: 65000
Orders: 420
CTR: 3.5
CPC: 0.35

Platform: Google
Spend: 10000
Revenue: 50000
Orders: 280
CTR: 5.1
CPC: 0.65</textarea>
<br><br>
<button onclick="analyze()">تحليل</button>
</div>

<div class="card">
<h3>AI Executive Summary</h3>
<div id="summary">اضغط تحليل</div>
</div>
</div>

<div class="kpis" id="kpis"></div>

<div class="platforms" id="platforms"></div>

<div class="charts">
<div class="card"><canvas id="revenueChart"></canvas></div>
<div class="card"><canvas id="roasChart"></canvas></div>
</div>
</div>
</div>

<script>
let revChart,roasChart;

function analyze(){
 const txt=document.getElementById('input').value;
 const blocks=txt.split(/\n\s*\n/);
 let data=[];

 blocks.forEach(b=>{
   const get=(k)=>{
    const m=b.match(new RegExp(k+'\\s*:\\s*([^\\n]+)','i'));
    return m?m[1].trim():'';
   };
   let p=get('Platform');
   if(!p) return;
   let spend=parseFloat(get('Spend'))||0;
   let revenue=parseFloat(get('Revenue'))||0;
   let orders=parseFloat(get('Orders'))||0;
   let ctr=parseFloat(get('CTR'))||0;
   let cpc=parseFloat(get('CPC'))||0;
   data.push({p,spend,revenue,orders,ctr,cpc,roas:(revenue/spend).toFixed(2)});
 });

 const totalSpend=data.reduce((a,b)=>a+b.spend,0);
 const totalRevenue=data.reduce((a,b)=>a+b.revenue,0);
 const totalOrders=data.reduce((a,b)=>a+b.orders,0);
 const roas=(totalRevenue/totalSpend).toFixed(2);

 document.getElementById('kpis').innerHTML=`
 <div class='kpi'><div class='small'>Revenue</div><div class='value'>${Math.round(totalRevenue)}</div></div>
 <div class='kpi'><div class='small'>Spend</div><div class='value'>${Math.round(totalSpend)}</div></div>
 <div class='kpi'><div class='small'>ROAS</div><div class='value'>${roas}</div></div>
 <div class='kpi'><div class='small'>Orders</div><div class='value'>${Math.round(totalOrders)}</div></div>`;

 let best=data.sort((a,b)=>b.roas-a.roas)[0];
 document.getElementById('summary').innerHTML=
 `أفضل منصة حالياً: <b>${best.p}</b><br>
 ROAS: <b>${best.roas}</b><br><br>
 إجمالي الإيراد: ${Math.round(totalRevenue)}<br>
 إجمالي الإنفاق: ${Math.round(totalSpend)}<br>
 ROAS الكلي: ${roas}`;

 document.getElementById('platforms').innerHTML=data.map(d=>{
 let cls='meta';
 if(d.p.toLowerCase().includes('snap')) cls='snap';
 else if(d.p.toLowerCase().includes('google')) cls='google';
 else if(d.p.toLowerCase().includes('tiktok')) cls='tiktok';
 return `<div class="platform ${cls}">${d.p}<br>ROAS ${d.roas}<br>Revenue ${d.revenue}</div>`;
 }).join('');

 const labels=data.map(x=>x.p);
 const rev=data.map(x=>x.revenue);
 const ro=data.map(x=>x.roas);

 if(revChart) revChart.destroy();
 if(roasChart) roasChart.destroy();

 revChart=new Chart(document.getElementById('revenueChart'),{
 type:'bar',
 data:{labels,datasets:[{label:'Revenue',data:rev}]}
 });

 roasChart=new Chart(document.getElementById('roasChart'),{
 type:'line',
 data:{labels,datasets:[{label:'ROAS',data:ro}]}
 });
}
analyze();
</script>
</body>
</html>
